<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden;
    background: #161826;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; width: 620px; height: 620px; right: -90px; top: -60px;
    background: radial-gradient(circle, rgba(143,131,220,0.30) 0%, rgba(143,131,220,0.08) 45%, rgba(22,24,38,0) 70%);
  }
  .glow2 {
    position: absolute; width: 520px; height: 520px; left: -220px; bottom: -300px;
    background: radial-gradient(circle, rgba(143,131,220,0.16) 0%, rgba(22,24,38,0) 70%);
  }
  /* faint background digits */
  .ghost { position: absolute; color: #8f83dc; opacity: 0.07; font-weight: 600; }
  .text {
    position: absolute; left: 80px; top: 0; height: 500px; width: 470px;
    display: flex; flex-direction: column; justify-content: center;
  }
  h1 {
    margin: 0; color: #f2f0fa; font-size: 74px; line-height: 1.0; font-weight: 700;
    letter-spacing: -1.5px;
  }
  h1 span { color: #a99ff0; }
  .tag {
    margin-top: 22px; color: #c9c4e6; font-size: 26px; line-height: 1.35; font-weight: 400;
  }
  .pills { margin-top: 30px; display: flex; gap: 12px; }
  .pill {
    border: 1.5px solid rgba(143,131,220,0.55); color: #d8d3fb; border-radius: 999px;
    padding: 8px 18px; font-size: 18px; font-weight: 500; background: rgba(143,131,220,0.10);
  }
  .board {
    position: absolute; right: 95px; top: 50%; transform: translateY(-50%) rotate(-6deg);
    filter: drop-shadow(0 24px 50px rgba(0,0,0,0.55)) drop-shadow(0 0 30px rgba(143,131,220,0.25));
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="ghost" style="left:560px; top:20px; font-size:60px; transform:rotate(-12deg)">3</div>
  <div class="ghost" style="left:500px; top:370px; font-size:64px; transform:rotate(10deg)">8</div>
  <div class="ghost" style="left:40px; top:20px; font-size:54px; transform:rotate(8deg)">6</div>

  <div class="text">
    <h1>Simple<br><span>Sudoku</span></h1>
    <div class="tag">Calm, clean puzzles that<br>grow harder as you level up.</div>
    <div class="pills">
      <div class="pill">Classic 9×9</div>
      <div class="pill">Mini 6×6</div>
      <div class="pill">5 difficulties</div>
    </div>
  </div>

  <svg class="board" width="370" height="370" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <clipPath id="clip"><rect x="0" y="0" width="680" height="680" rx="36"/></clipPath>
    </defs>
    <g clip-path="url(#clip)">
      <rect x="0" y="0" width="680" height="680" fill="#171a28"/>
      <!-- highlighted centre box -->
      <rect x="226.7" y="226.7" width="226.6" height="226.6" fill="#463c6c"/>
      <!-- minor lines -->
      <g stroke="#6b6d7d" stroke-width="2.5">
        <line x1="75.6" y1="0" x2="75.6" y2="680"/><line x1="151.1" y1="0" x2="151.1" y2="680"/>
        <line x1="302.2" y1="0" x2="302.2" y2="226.7"/><line x1="377.8" y1="0" x2="377.8" y2="226.7"/>
        <line x1="302.2" y1="453.3" x2="302.2" y2="680"/><line x1="377.8" y1="453.3" x2="377.8" y2="680"/>
        <line x1="528.9" y1="0" x2="528.9" y2="680"/><line x1="604.4" y1="0" x2="604.4" y2="680"/>
        <line y1="75.6" x1="0" y2="75.6" x2="680"/><line y1="151.1" x1="0" y2="151.1" x2="680"/>
        <line y1="302.2" x1="0" y2="302.2" x2="226.7"/><line y1="377.8" x1="0" y2="377.8" x2="226.7"/>
        <line y1="302.2" x1="453.3" y2="302.2" x2="680"/><line y1="377.8" x1="453.3" y2="377.8" x2="680"/>
        <line y1="528.9" x1="0" y2="528.9" x2="680"/><line y1="604.4" x1="0" y2="604.4" x2="680"/>
      </g>
      <!-- major lines with glow -->
      <g stroke="#8f83dc" stroke-width="8" filter="url(#g)">
        <line x1="226.7" y1="0" x2="226.7" y2="680"/><line x1="453.3" y1="0" x2="453.3" y2="680"/>
        <line y1="226.7" x1="0" y2="226.7" x2="680"/><line y1="453.3" x1="0" y2="453.3" x2="680"/>
      </g>
      <!-- digits -->
      <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="500" text-anchor="middle">
        <text x="113.3" y="136" fill="#d8d3fb">7</text>
        <text x="566.7" y="136" fill="#f2f0fa">4</text>
        <text x="340" y="364" fill="#f2f0fa" font-size="76">5</text>
        <text x="113.3" y="590" fill="#f2f0fa">9</text>
        <text x="566.7" y="590" fill="#d8d3fb">2</text>
      </g>
    </g>
    <rect x="9" y="9" width="662" height="662" rx="30" fill="none" stroke="#e9e8ef" stroke-width="18"/>
  </svg>
</body>
</html>
